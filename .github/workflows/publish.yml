name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Prod round-trip + cross-container tenant-isolation gate. Publish CANNOT
  # run unless this passes (see `needs: smoke` on the publish job below).
  smoke:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm run smoke
        env:
          MNEMO_API_KEY: ${{ secrets.MNEMO_API_KEY }}
          MNEMO_WORKSPACE_ID: ${{ secrets.MNEMO_WORKSPACE_ID }}
          MNEMO_TEST_CONTAINER: ${{ secrets.MNEMO_TEST_CONTAINER }}

  # Auth is npm Trusted Publishing (OIDC): the registry trusts this repo's
  # publish.yml via the runner's id-token — no NPM_TOKEN secret, nothing to
  # expire. The OIDC code path only exists in npm >= 11.5.1 (node 22 bundles
  # npm 10), hence the pinned upgrade step; bump the pin deliberately, never
  # float `latest` through the step that signs provenance. --provenance is
  # what enables attestation here (explicit flag, not OIDC auto-enable).
  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build --if-present
      - run: npm publish --access public --provenance
